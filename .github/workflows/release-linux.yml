name: Publicar versao Linux

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag criada pelo Release Please
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gerar e publicar release Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validar tag e versao
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          tag="${{ inputs.tag || github.ref_name }}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Versao invalida no manifesto: $version" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "A tag $tag nao corresponde ao manifesto ($version). Use a tag v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Gerar executavel (compilado em Ubuntu 22.04 p/ compatibilidade de GLIBC)
        run: |
          set -eux
          # GLIBC do ubuntu-latest e mais nova que a do Mint 21.x/Ubuntu 22.04; builda aqui pra manter compatibilidade
          docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash -c '
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq software-properties-common >/dev/null
            add-apt-repository -y ppa:deadsnakes/ppa >/dev/null
            apt-get update -qq >/dev/null
            apt-get install -y -qq python3.12 python3.12-venv python3.12-dev >/dev/null

            python3.12 -m ensurepip --upgrade
            python3.12 -m pip install --upgrade pip -q
            python3.12 -m pip install -r backend/requirements.txt -r frontend/requirements.txt -q
            python3.12 -m pip install flet-desktop==0.28.3 flet-web==0.28.3 pyinstaller -q

            python3.12 -m unittest discover -s tests -v
            python3.12 -m PyInstaller --clean --noconfirm FaccuPoint-Linux.spec

            python3.12 -c "from PIL import Image; Image.open(\"frontend/assets/image/logoF.png\").convert(\"RGBA\").resize((256, 256)).save(\"faccupoint-256.png\")"

            chown -R "$(stat -c "%u:%g" /work)" /work
          '

      - name: Validar pacote gerado
        run: dist/FaccuPoint --smoke-test-package

      - name: Empacotar tarball e gerar checksum
        run: |
          chmod +x dist/FaccuPoint
          tar -C dist -czf FaccuPoint-Linux-x86_64.tar.gz FaccuPoint
          sha256sum FaccuPoint-Linux-x86_64.tar.gz > FaccuPoint-Linux-x86_64.tar.gz.sha256

      - name: Montar pacote .deb
        run: |
          set -eux
          version="${{ steps.version.outputs.version }}"

          PKGDIR=deb/faccupoint
          mkdir -p "$PKGDIR/DEBIAN" \
                   "$PKGDIR/usr/bin" \
                   "$PKGDIR/usr/share/applications" \
                   "$PKGDIR/usr/share/icons/hicolor/256x256/apps"

          sed "s/__VERSION__/$version/" packaging/deb/control.template > "$PKGDIR/DEBIAN/control"

          cp dist/FaccuPoint "$PKGDIR/usr/bin/FaccuPoint"
          chmod +x "$PKGDIR/usr/bin/FaccuPoint"

          cp packaging/appimage/faccupoint.desktop "$PKGDIR/usr/share/applications/faccupoint.desktop"

          cp faccupoint-256.png "$PKGDIR/usr/share/icons/hicolor/256x256/apps/faccupoint.png"

          dpkg-deb --root-owner-group --build "$PKGDIR" "faccupoint_${version}_amd64.deb"
          sha256sum "faccupoint_${version}_amd64.deb" > "faccupoint_${version}_amd64.deb.sha256"

      - name: Validar pacote .deb
        run: |
          set -eux
          version="${{ steps.version.outputs.version }}"
          sudo apt-get install -y "./faccupoint_${version}_amd64.deb"
          /usr/bin/FaccuPoint --smoke-test-package
          sudo apt-get remove -y faccupoint

      - name: Montar AppImage
        run: |
          set -eux
          export ARCH=x86_64

          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp dist/FaccuPoint "$APPDIR/usr/bin/FaccuPoint"
          chmod +x "$APPDIR/usr/bin/FaccuPoint"

          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp packaging/appimage/faccupoint.desktop "$APPDIR/faccupoint.desktop"
          cp packaging/appimage/faccupoint.desktop "$APPDIR/usr/share/applications/faccupoint.desktop"

          cp faccupoint-256.png "$APPDIR/faccupoint.png"
          cp "$APPDIR/faccupoint.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/faccupoint.png"
          ln -sf faccupoint.png "$APPDIR/.DirIcon"

          # sem FUSE nao ha fallback automatico; por isso o .deb e o formato recomendado, isso aqui fica como opcao portatil
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x appimagetool

          ./appimagetool --appimage-extract-and-run \
            --runtime-file runtime-x86_64 \
            "$APPDIR" FaccuPoint-x86_64.AppImage

          chmod +x FaccuPoint-x86_64.AppImage
          sha256sum FaccuPoint-x86_64.AppImage > FaccuPoint-x86_64.AppImage.sha256

      - name: Validar AppImage
        run: ./FaccuPoint-x86_64.AppImage --appimage-extract-and-run --smoke-test-package

      - name: Criar ou atualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${{ steps.version.outputs.version }}"
          arquivos=(
            FaccuPoint-Linux-x86_64.tar.gz
            FaccuPoint-Linux-x86_64.tar.gz.sha256
            "faccupoint_${version}_amd64.deb"
            "faccupoint_${version}_amd64.deb.sha256"
            FaccuPoint-x86_64.AppImage
            FaccuPoint-x86_64.AppImage.sha256
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${arquivos[@]}" --clobber
          else
            gh release create "$tag" "${arquivos[@]}" \
              --verify-tag \
              --title "FaccuPoint ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
